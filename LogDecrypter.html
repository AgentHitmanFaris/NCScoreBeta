<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NC Score Log Decrypter (V2)</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 900px;
        }
        h1 { margin-top: 0; color: #333; font-size: 24px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            box-sizing: border-box;
        }
        #privateKeyInput { height: 150px; }
        #logInput { height: 100px; }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover { background-color: #218838; }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 13px;
            overflow-x: auto;
            display: none;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #333;
        }
        .error { color: #ff5555; background: #2d1d1d !important; border-color: #6d2d2d !important; }
        .info { font-size: 12px; color: #666; margin-bottom: 20px; line-height: 1.5; }
    </style>
</head>
<body>

<div class="container">
    <h1>NC Score Hybrid Log Decrypter</h1>
    <div class="info">
        This tool decrypts logs using the <strong>RSA + AES Hybrid</strong> scheme. <br>
        1. Decrypts the 256-bit AES key using your RSA Private Key (OAEP SHA-256). <br>
        2. Decrypts the payload using AES-CBC. <br>
        3. Decompresses the result using GZIP.
    </div>
    
    <div class="input-group">
        <label for="privateKeyInput">RSA Private Key (PKCS#8 PEM format)</label>
        <textarea id="privateKeyInput" placeholder="-----BEGIN PRIVATE KEY-----&#10;...&#10;-----END PRIVATE KEY-----"></textarea>
    </div>

    <div class="input-group">
        <label for="logInput">Encrypted Base64 String (from Firestore)</label>
        <textarea id="logInput" placeholder="Paste the encryptedLogs string here..."></textarea>
    </div>

    <button onclick="decryptLogs()">Decrypt & Decompress</button>

    <div id="output"></div>
</div>

<script>
    async function decryptLogs() {
        const privateKeyPem = document.getElementById('privateKeyInput').value.trim();
        const encryptedB64 = document.getElementById('logInput').value.trim();
        const outputDiv = document.getElementById('output');

        if (!privateKeyPem || !encryptedB64) {
            alert("Please provide both the Private Key and the Encrypted Log string.");
            return;
        }

        try {
            outputDiv.style.display = 'block';
            outputDiv.textContent = "Processing...";
            outputDiv.classList.remove("error");

            // 1. Decode main Base64
            const combinedData = Uint8Array.from(atob(encryptedB64), c => c.charCodeAt(0));

            // Format check (256 key + 16 IV + payload)
            if (combinedData.length < 272) {
                throw new Error("Encrypted string is too short to be a valid hybrid package.");
            }

            const encryptedAesKey = combinedData.slice(0, 256);
            const iv = combinedData.slice(256, 272);
            const encryptedPayload = combinedData.slice(272);

            // 2. Import Private Key
            const pemHeader = "-----BEGIN PRIVATE KEY-----";
            const pemFooter = "-----END PRIVATE KEY-----";
            const pemContents = privateKeyPem.substring(pemHeader.length, privateKeyPem.length - pemFooter.length).replace(/\s+/g, '');
            const binaryKey = Uint8Array.from(atob(pemContents), c => c.charCodeAt(0));

            const rsaKey = await window.crypto.subtle.importKey(
                "pkcs8",
                binaryKey,
                {
                    name: "RSA-OAEP",
                    hash: "SHA-256"
                },
                false,
                ["decrypt"]
            );

            // 3. Decrypt AES Key
            outputDiv.textContent = "Decrypting AES Key...";
            const aesKeyBuffer = await window.crypto.subtle.decrypt(
                { name: "RSA-OAEP" },
                rsaKey,
                encryptedAesKey
            );

            // 4. Decrypt Payload
            outputDiv.textContent = "Decrypting Payload...";
            const aesKey = await window.crypto.subtle.importKey(
                "raw",
                aesKeyBuffer,
                { name: "AES-CBC" },
                false,
                ["decrypt"]
            );

            const decryptedBuffer = await window.crypto.subtle.decrypt(
                { name: "AES-CBC", iv: iv },
                aesKey,
                encryptedPayload
            );

            // 5. Decompress GZIP
            outputDiv.textContent = "Decompressing...";
            const ds = new DecompressionStream("gzip");
            const writer = ds.writable.getWriter();
            writer.write(decryptedBuffer);
            writer.close();
            
            const decompressedArrayBuffer = await new Response(ds.readable).arrayBuffer();
            const logText = new TextDecoder().decode(decompressedArrayBuffer);

            outputDiv.textContent = logText;

        } catch (e) {
            console.error(e);
            outputDiv.textContent = "DECRYPTION ERROR: " + e.message +
                "\n\nCommon causes:\n- Incorrect Private Key\n- Private Key is not in PKCS#8 format\n- Log string is corrupted or incomplete\n- Browser does not support DecompressionStream (use Chrome/Edge/Firefox)";
            outputDiv.classList.add("error");
        }
    }
</script>

</body>
</html>
