<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NC Score Log Decrypter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 800px;
        }
        h1 { margin-top: 0; color: #333; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            resize: vertical;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0056b3; }
        #output {
            margin-top: 20px;
            white-space: pre-wrap;
            background: #1e1e1e;
            color: #a9b7c6;
            padding: 20px;
            border-radius: 8px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 13px;
            overflow-x: auto;
            display: none;
            max-height: 500px;
            overflow-y: auto;
        }
        .error { color: #ff5555; }
    </style>
</head>
<body>

<div class="container">
    <h1>Log Decrypter Tool</h1>
    <p>Paste the <code>encryptedLogs</code> string from Firestore below.</p>
    
    <div class="input-group">
        <label for="keyInput">RSA Private Key (PKCS8)</label>
        <textarea id="keyInput" placeholder="Paste your RSA Private Key here (-----BEGIN PRIVATE KEY...)" style="height: 150px;"></textarea>
    </div>

    <div class="input-group">
        <label for="logInput">Encrypted Base64 String (Hybrid Encrypted)</label>
        <textarea id="logInput" placeholder="Paste encrypted string here..."></textarea>
    </div>

    <button onclick="decryptLogs()">Decrypt Logs</button>

    <div id="output"></div>
</div>

<script>
    // Helper to convert PEM string to ArrayBuffer
    function pemToArrayBuffer(pem) {
        const b64Lines = pem.replace(/-----[^-]+-----/g, '').replace(/\s+/g, '');
        const binaryString = atob(b64Lines);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
            bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
    }

    // We use the Web Crypto API
    async function decryptLogs() {
        const keyString = document.getElementById('keyInput').value.trim();
        const inputString = document.getElementById('logInput').value.trim();
        const outputDiv = document.getElementById('output');

        if (!inputString || !keyString) {
            alert("Please paste both the private key and the encrypted string.");
            return;
        }

        try {
            outputDiv.style.display = 'block';
            outputDiv.textContent = "Decrypting...";
            outputDiv.classList.remove("error");

            // 1. Base64 Decode the main payload
            const binaryString = atob(inputString);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }

            // Structure: [Encrypted AES Key (256 bytes)] + [IV (16 bytes)] + [Ciphertext (rest)]
            if (bytes.length < 272) {
                throw new Error("Input data is too short to be valid.");
            }

            const encryptedAesKey = bytes.slice(0, 256);
            const iv = bytes.slice(256, 272);
            const ciphertext = bytes.slice(272);

            // 2. Import RSA Private Key
            const privateKeyBuffer = pemToArrayBuffer(keyString);
            const privateKey = await window.crypto.subtle.importKey(
                "pkcs8",
                privateKeyBuffer,
                { name: "RSA-OAEP", hash: "SHA-256" },
                false,
                ["decrypt"]
            );

            // 3. Decrypt AES Key using RSA
            const aesKeyRaw = await window.crypto.subtle.decrypt(
                { name: "RSA-OAEP" },
                privateKey,
                encryptedAesKey
            );

            // 4. Import Decrypted AES Key
            const aesKey = await window.crypto.subtle.importKey(
                "raw",
                aesKeyRaw,
                { name: "AES-CBC" },
                false,
                ["decrypt"]
            );

            // 5. Decrypt Payload using AES
            const decryptedBuffer = await window.crypto.subtle.decrypt(
                { name: "AES-CBC", iv: iv },
                aesKey,
                ciphertext
            );

            // 6. Decompress (GZIP)
            // Using DecompressionStream
            const ds = new DecompressionStream("gzip");
            const writer = ds.writable.getWriter();
            writer.write(decryptedBuffer);
            writer.close();
            
            const decompressedArrayBuffer = await new Response(ds.readable).arrayBuffer();
            const decoder = new TextDecoder("utf-8");
            const logText = decoder.decode(decompressedArrayBuffer);

            outputDiv.textContent = logText;

        } catch (e) {
            console.error(e);
            outputDiv.textContent = "Error: " + e.message + "\n\nCheck console for details.";
            outputDiv.classList.add("error");
        }
    }
</script>

</body>
</html>
